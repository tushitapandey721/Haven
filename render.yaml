services:
  - type: web
    name: haven-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: haven-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1

databases:
  - name: haven-db
    databaseName: haven
    user: haven
    plan: free
    region: oregon
    postgresMajorVersion: 16
